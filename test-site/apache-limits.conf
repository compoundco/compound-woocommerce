# Raise Apache request-header limits for local dev. Everything runs on localhost,
# and cookies are not port-scoped, so this WordPress site receives the cookies set
# by every other localhost app (admin portal, ops portal, etc.) on top of its own.
# The combined Cookie header exceeds Apache's default 8 KB LimitRequestFieldSize and
# returns "400 Bad Request: Size of a request header field exceeds server limit".
# Dev-only; production sites don't share a host with unrelated apps.
LimitRequestLine 65536
LimitRequestFieldSize 65536
